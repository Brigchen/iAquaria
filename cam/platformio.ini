; iAqua 摄像头节点（ESP32 + OV3660/OV2640）
; 固件提供:
;   http://<ip>/          状态页(JSON)
;   http://<ip>/capture   单帧 JPEG
;   http://<ip>:81/stream MJPEG 视频流
;   http://<ip>/wifi      AP 配网页（STA 连不上时自动开热点 iAqua-Cam/12345678）
; mDNS 主机名: iaqua-cam.local
[env:cam]
platform = espressif32 @ 7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; ---- 刷机前把下面两行改成家庭 WiFi（勿提交真实密码）----
    -DCAM_WIFI_SSID='"YOUR_WIFI_SSID"'
    -DCAM_WIFI_PASS='"YOUR_WIFI_PASSWORD"'
    ; ---- 摄像头引脚预置（二选一，默认 AI-Thinker 兼容排布）----
    -DCAM_PRESET_AI_THINKER
    ; -DCAM_PRESET_ESP_EYE

lib_deps =
    https://github.com/knolleary/pubsubclient/archive/refs/tags/v2.8.zip  ; 云照片上传（EMQX MQTT over TLS）
