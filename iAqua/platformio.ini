; PlatformIO Project Configuration File - iAqua 水族缸智能系统固件
; 板卡: 经典 ESP32 (ESP32-D0WD-V3 / DevKitC WROOM-32, 4MB Flash, CP210x USB-UART)

[env:esp32dev]
platform = espressif32 @ 7.1.2
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -DCORE_DEBUG_LEVEL=1
; 构建前把 data/www/index.html gzip 压缩成 src/web/www_gz.h 嵌入固件
extra_scripts = pre:tools/gzip_asset.py
; 库注册表在国内不稳定，直接用 GitHub 归档 zip（已验证可达）
lib_deps =
    https://github.com/emelianov/modbus-esp8266/archive/refs/tags/4.1.1.zip       ; 异步 Modbus RTU 主站（支持 C3 + DE 引脚）
    https://github.com/paulstoffregen/OneWire/archive/refs/tags/v2.3.8.zip        ; DS18B20 单总线
    https://github.com/milesburton/Arduino-Temperature-Control-Library/archive/refs/tags/v4.0.3.zip ; DS18B20 高层驱动（异步转换模式）
    https://github.com/ESP32Async/AsyncTCP/archive/refs/tags/v3.5.0.zip           ; 异步 TCP 底座
    https://github.com/ESP32Async/ESPAsyncWebServer/archive/refs/tags/v3.12.0.zip ; 异步 HTTP + WebSocket（同 80 端口）
    https://github.com/bblanchon/ArduinoJson/archive/refs/tags/v7.4.3.zip         ; JSON 编解码
    https://github.com/knolleary/pubsubclient/archive/refs/tags/v2.8.zip          ; MQTT 客户端（EMQX 云上行）
